<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Eletrônica Osmar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a55">
<style>
:root{
  --bg:#eef2ef; --card:#ffffff; --ink:#14201b; --muted:#5b6b63; --line:#d3ddd7;
  --accent:#1f7a55; --accent-ink:#ffffff; --accent-soft:#dcefe5;
  --warn:#9a4a05; --warn-bg:#fdecd8; --danger:#b3261e; --ok:#1f7a55;
  --shadow:0 1px 2px rgba(20,32,27,.08);
  --c-ok:#1f9d55; --c-low:#e07b00; --c-zero:#d32f2f; --c-ret:#2f6fd0; --on-c:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1613; --card:#16211c; --ink:#e5eee9; --muted:#93a59b; --line:#27382f;
    --accent:#4cc68d; --accent-ink:#06241a; --accent-soft:#1b3328;
    --warn:#f0b36b; --warn-bg:#3a2a14; --danger:#ff8a80; --ok:#4cc68d; --shadow:none; --c-ok:#4cc68d; --c-low:#ffa63d; --c-zero:#ff7676; --c-ret:#7aa9ff; --on-c:#10140f;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1613; --card:#16211c; --ink:#e5eee9; --muted:#93a59b; --line:#27382f;
  --accent:#4cc68d; --accent-ink:#06241a; --accent-soft:#1b3328;
  --warn:#f0b36b; --warn-bg:#3a2a14; --danger:#ff8a80; --ok:#4cc68d; --shadow:none; --c-ok:#4cc68d; --c-low:#ffa63d; --c-zero:#ff7676; --c-ret:#7aa9ff; --on-c:#10140f;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;padding:10px 14px;min-height:56px}
:root[data-theme="dark"] header.top{background:var(--card);color:var(--ink);border-bottom:2px solid var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:var(--card);color:var(--ink);border-bottom:2px solid var(--accent)}}
.brand{font-size:12px;opacity:.85;font-weight:500;line-height:1.1}
header.top h1{font-size:19px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;color:inherit;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-left:-8px}
.iconbtn:active{background:rgba(255,255,255,.18)}

main{padding:14px 14px 150px;max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:500;min-height:56px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

.search input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin:0 -14px 4px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.row .grow{flex:1;min-width:0}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row small,.sub{color:var(--muted);font-size:14px}
.row small{display:block;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:13px;text-align:right}
.tag{display:inline-block;border:1.5px solid var(--ink);border-radius:5px;padding:0 6px;font-size:13px;font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.zero{background:var(--danger);color:#fff}
.group{font-size:14px;font-weight:600;color:var(--muted);margin:18px 2px 8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin-top:8px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;min-height:44px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.small{padding:7px 12px;min-height:36px;font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:9;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:22px;line-height:1;font-weight:600}
.qty span{min-width:30px;text-align:center;font-weight:700;font-size:18px}

.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:10px 4px;font-size:14px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:61;max-width:720px;margin:0 auto}
.sheet h2{margin:0 0 12px;font-size:19px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.fld .bad{border-color:var(--danger)}
.sheet .btns{display:flex;gap:8px;margin-top:6px}
.sheet .btns .btn{flex:1}
textarea.notes{width:100%;min-height:55vh;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);line-height:1.5;resize:vertical}
.saved{font-size:13px;color:var(--muted);height:20px;margin-top:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:70;font-size:14px;max-width:88%}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}

.viewer{position:fixed;inset:0;z-index:40;background:#0b0f0d;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.viewer .bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#16211c;color:#e5eee9}
.viewer .bar .ttl{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .bar button{background:#27382f;color:#e5eee9;border:0;border-radius:10px;min-width:44px;height:44px;font-size:20px;font-weight:600}
.viewer .body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer img{display:block;height:auto;background:#fff}
.viewer canvas{display:block;background:#fff;margin:0 0 8px}
.viewer .msg{color:#e5eee9;padding:24px;text-align:center}
.st{border-left:7px solid var(--stc,var(--line))}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--stc);margin-right:6px}
.pill.c{background:var(--stc);color:var(--on-c)}
.plain{all:unset;display:block;width:100%;cursor:pointer}
.plain:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.qty span.n{background:var(--stc);color:var(--on-c);border-radius:10px;padding:6px 0;min-width:46px}
.buy{display:inline-block;margin-top:8px;padding:7px 16px;border-radius:999px;background:var(--stc);color:var(--on-c);font-weight:700;font-size:14px;text-decoration:none}
.statusbtns{display:flex;gap:8px;margin-bottom:8px}
.statusbtns button{flex:1;border:2px solid var(--stc);background:transparent;color:var(--ink);border-radius:10px;padding:11px 4px;font-weight:600;font-size:14px;min-height:46px}
.statusbtns button[aria-pressed="true"]{background:var(--stc);color:var(--on-c)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.thumbs button{padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.hidden{display:none!important}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
</style>
<script src="pdf.min.js"></script>
</head>
<body>
<header class="top"><button class="iconbtn hidden" id="back" data-act="back" aria-label="Voltar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div style="flex:1;min-width:0"><div class="brand">Eletrônica Osmar</div><h1 id="title">Clientes</h1></div></header>
<main id="app"></main>
<nav class="tabs" id="tabs" aria-label="Seções">
  <button data-act="tab" data-v="clientes"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Clientes</button>
  <button data-act="tab" data-v="consertos"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg>Consertos</button>
  <button data-act="tab" data-v="estoque"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Estoque</button>
  <button data-act="tab" data-v="equips"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Equipamentos</button>
  <button data-act="tab" data-v="backup"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Backup</button>
</nav>
<div id="layer"></div>
<div id="viewer" class="viewer hidden"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const money = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fdate = d => d ? d.split('-').reverse().join('/') : '';
const today = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const parseMoney = s => { const n = parseFloat(String(s).replace(/\./g,'').replace(',', '.')); return isNaN(n) ? 0 : n; };
const moneyIn = v => (v == null || v === '') ? '' : String(v).replace('.', ',');
const pad = n => String(n).padStart(4, '0');
const maskCPF = v => { v = v.replace(/\D/g,'').slice(0,11); return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); };

let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 2600); }

/* ---------- banco de dados no aparelho (IndexedDB) ---------- */
const STORES = ['clientes','consertos','estoque','equip','arquivos'], TOMB = 'lixeira';
let idb = null, memOnly = false;
function openDB(){
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('sem indexedDB'));
    const r = indexedDB.open('bancada-oficina', 2);
    r.onupgradeneeded = () => { STORES.concat(TOMB).forEach(n => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, {keyPath:'id'}); }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('bloqueado'));
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    if (!idb) return res([]);
    const t = idb.transaction(store, mode);
    const rq = fn(t.objectStore(store));
    t.oncomplete = () => res(rq ? rq.result : undefined);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const dbAll = n => tx(n, 'readonly', s => s.getAll());
const dbPut = async (n, o) => { o._u = Date.now(); try { await tx(n, 'readwrite', s => s.put(o)); syQueue(); } catch(e){ toast('Não consegui salvar. Faça um backup.'); } };
const dbDel = async (n, id) => { try { await tx(n, 'readwrite', s => s.delete(id)); await tx(TOMB, 'readwrite', s => s.put({id:n + ':' + id, _u:Date.now()})); syQueue(); } catch(e){ toast('Não consegui excluir.'); } };
const dbClear = n => tx(n, 'readwrite', s => s.clear());

/* ---------- estado ---------- */
const S = {clientes:[], consertos:[], estoque:[], equip:[]};
let route = {v:'clientes'}, stack = [];
const ui = {q:'', est:'todos', cat:'todas', cst:'todos'};
const filesCache = {};
const CATS = ['Aparelhos de som','Televisões','Rádios','Diversos'];

function go(r){ stack.push(route); route = r; ui.q = ''; render(); window.scrollTo(0,0); }
function tab(v){ stack = []; route = {v}; ui.q = ''; ui.est = 'todos'; ui.cat = 'todas'; ui.cst = 'todos'; render(); window.scrollTo(0,0); }
function back(){ route = stack.pop() || {v:'clientes'}; ui.q = ''; render(); }

/* ---------- formulário em folha inferior ---------- */
function closeLayer(){ $('#layer').innerHTML = ''; }
function fieldHtml(f, v){
  const id = 'f_' + f.k, ph = esc(f.ph || '');
  let inp;
  if (f.t === 'area') inp = `<textarea id="${id}" rows="3" placeholder="${ph}">${esc(v ?? '')}</textarea>`;
  else if (f.t === 'select') inp = `<select id="${id}">${f.opts.map(([k,l]) => `<option value="${esc(k)}"${k === (v ?? '') ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else if (f.t === 'combo') inp = `<input id="${id}" list="${id}_l" value="${esc(v ?? '')}" placeholder="${ph}" autocomplete="off"><datalist id="${id}_l">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
  else {
    const type = {num:'number', date:'date', tel:'tel', url:'url'}[f.t] || 'text';
    const extra = f.t === 'money' ? ' inputmode="decimal"' : f.t === 'num' ? ' inputmode="numeric" min="0" step="1"' : f.t === 'cpf' ? ' inputmode="numeric"' : '';
    const val = f.t === 'money' ? moneyIn(v) : (v ?? '');
    inp = `<input id="${id}" type="${type}"${extra} value="${esc(val)}" placeholder="${ph}">`;
  }
  return `<label class="fld"><span>${esc(f.l)}</span>${inp}</label>`;
}
function openForm({title, fields, values = {}, onSave, onDelete, saveLabel = 'Salvar'}){
  $('#layer').innerHTML = `<div class="scrim" data-act="close"></div>
  <div class="sheet" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>
  ${fields.map(f => fieldHtml(f, values[f.k])).join('')}
  <div class="btns"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" id="fsave">${saveLabel}</button></div>
  ${onDelete ? '<div class="btns"><button class="btn danger" id="fdel">Excluir</button></div>' : ''}</div>`;
  const cpf = $('#f_cpf'); if (cpf) cpf.addEventListener('input', () => { cpf.value = maskCPF(cpf.value); });
  $('#fsave').onclick = async () => {
    const out = {}; let bad = null;
    for (const f of fields){
      const el = $('#f_' + f.k); let val = el.value.trim();
      if (f.req && !val){ el.classList.add('bad'); bad = bad || f; continue; }
      if (f.t === 'money') val = parseMoney(val);
      else if (f.t === 'num') val = val === '' ? 0 : Math.max(0, Number(val));
      out[f.k] = val;
    }
    if (bad){ toast('Preencha: ' + bad.l); return; }
    closeLayer(); await onSave(out); render();
  };
  if (onDelete) $('#fdel').onclick = () => confirmDlg('Excluir de vez? Isso não pode ser desfeito.', async () => { await onDelete(); render(); });
  const first = $('.sheet input, .sheet textarea'); if (first && !first.value) setTimeout(() => first.focus(), 60);
}
function confirmDlg(msg, onYes, yes = 'Excluir'){
  $('#layer').innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="alertdialog"><h2>${esc(msg)}</h2>
  <div class="btns"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn ${yes === 'Excluir' ? 'danger' : ''}" id="cyes">${yes}</button></div></div>`;
  $('#cyes').onclick = async () => { closeLayer(); await onYes(); };
}

/* ---------- Clientes ---------- */
function clienteFields(){ return [
  {k:'nome', l:'Nome', req:true}, {k:'cpf', l:'CPF', t:'cpf', ph:'000.000.000-00'},
  {k:'tel', l:'Telefone / WhatsApp', t:'tel'}, {k:'end', l:'Endereço'}, {k:'obs', l:'Observações', t:'area'}]; }
function listClientes(){
  const q = norm(ui.q);
  const l = S.clientes.filter(c => !q || norm(c.nome + ' ' + c.cpf + ' ' + c.tel).includes(q)).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  if (!l.length) return S.clientes.length ? '<div class="empty">Nenhum cliente encontrado.</div>' : '<div class="empty"><b>Nenhum cliente ainda</b>Toque em “Novo cliente” para cadastrar o primeiro.</div>';
  return l.map(c => {
    const cs = S.consertos.filter(x => x.clienteId === c.id), and = cs.filter(x => x.status === 'andamento').length;
    return `<button class="row" data-act="open-cliente" data-id="${c.id}"><div class="grow"><b>${esc(c.nome)}</b><small>${esc([c.cpf, c.tel].filter(Boolean).join('  ·  ') || 'Sem CPF/telefone')}</small></div>
    <div class="meta">${cs.length} conserto${cs.length === 1 ? '' : 's'}${and ? `<br><span class="pill c" style="--stc:var(--c-low)">${and} em andamento</span>` : ''}</div></button>`;
  }).join('');
}
function viewClientes(){
  return `<div class="search"><input id="q" type="search" placeholder="Buscar por nome, CPF ou telefone" value="${esc(ui.q)}" autocomplete="off"></div>
  <div id="list">${listClientes()}</div><button class="fab" data-act="novo-cliente">+ Novo cliente</button>`;
}
const STATUS = {andamento:['Em andamento','var(--c-low)'], pronto:['Pronto','var(--c-ok)'], retirado:['Retirado','var(--c-ret)']};
const stOf = x => STATUS[x.status] || STATUS.andamento;
const stPill = x => `<span class="pill c" style="--stc:${stOf(x)[1]}">${stOf(x)[0]}</span>`;
function conRow(x, showCli){
  const st = stOf(x), c = showCli ? S.clientes.find(k => k.id === x.clienteId) : null;
  const sub = [c ? c.nome : '', fdate(x.data), x.valor ? money(x.valor) : ''].filter(Boolean).join('  ·  ');

async function shrink(file, max = 2800, minSize = 1.5*1024*1024, q = 0.88){
  if (!file.type.startsWith('image/') || file.size < minSize) return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    return b && (b.size < file.size || minSize === 0) ? b : file;
  } catch(e){ return file; }
}
async function makeThumb(blob){
  try {
    const bmp = await createImageBitmap(blob), k = Math.min(1, 360 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width*k)); c.height = Math.max(1, Math.round(bmp.height*k));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.7);
  } catch(e){ try { return await blobToDataURL(blob); } catch(_){ return ''; } }
}
async function addFotos(files){
  const isCon = route.v === 'conserto', owner = (isCon ? S.consertos : S.estoque).find(x => x.id === route.id);
  if (!owner) return; let n = 0;
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    const b = await shrink(f, 1800, 0, 0.85), thumb = await makeThumb(b);
    await dbPut('arquivos', {id:uid(), equipId:owner.id, nome:f.name || 'foto.jpg', tipo:b.type || 'image/jpeg', blob:b, tam:b.size, criado:Date.now(), foto:true, thumb}); n++;
  }
  if (n){ owner.nfotos = (owner.nfotos || 0) + n; await dbPut(isCon ? 'consertos' : 'estoque', owner); await loadFiles(owner.id); toast(n + ' foto(s) salva(s).'); render(); }
}
async function deleteFile(f){

    const o = S.consertos.find(x => x.id === f.equipId) || S.estoque.find(x => x.id === f.equipId);

const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
function dataURLToBlob(u){ const [h, d] = u.split(','), m = /:(.*?);/.exec(h)[1], bin = atob(d), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type:m}); }

let vw = {file:null, zoom:1, url:null};

  if (f.tipo !== 'application/pdf'){ try { vw.url = await blobToDataURL(f.blob); } catch(e){ $('#vbody').innerHTML = '<div class="msg">Não consegui abrir este arquivo.</div>'; return; } }
  paintViewer();

async function paintViewer(){
  const body = $('#vbody'), f = vw.file; if (!body) return;
  const keepX = body.scrollLeft, keepY = body.scrollTop;
  if (f.tipo !== 'application/pdf'){
    body.innerHTML = `<img alt="${esc(f.nome)}" src="${vw.url}" style="width:${vw.zoom*100}%;max-width:none">`;
  } else {
    const lib = window.pdfjsLib;
    if (!lib){ body.innerHTML = '<div class="msg">Não consegui carregar o leitor de PDF Dica: tire uma foto ou print do esquema e adicione como imagem.</div>'; return; }
    body.innerHTML = '<div class="msg">Carregando PDF…</div>';
    try {
      lib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
      const pdf = await lib.getDocument({data: await f.blob.arrayBuffer()}).promise;
      const mine = vw.file, myZoom = vw.zoom, w = Math.max(280, body.clientWidth * vw.zoom), dpr = Math.min(2, window.devicePixelRatio || 1);
      body.innerHTML = '';
      for (let i = 1; i <= pdf.numPages; i++){
        if (vw.file !== mine || vw.zoom !== myZoom) return;
        const page = await pdf.getPage(i), v0 = page.getViewport({scale:1});
        const sc = Math.min(w * dpr / v0.width, 4000 / v0.width), vp = page.getViewport({scale:sc});
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.style.width = w + 'px';
        body.appendChild(c);
        await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
      }
    } catch(e){ body.innerHTML = '<div class="msg">Não consegui abrir este PDF aqui. Dica: tire um print das páginas do esquema e adicione como imagem.</div>'; return; }
  }
  body.scrollLeft = keepX; body.scrollTop = keepY;
}

async function doImport(file){

    for (const n of STORES) for (const o of await dbAll(n)) await tx(TOMB, 'readwrite', s => s.put({id:n + ':' + o.id, _u:Date.now() - 1000}));
    for (const n of STORES) await dbClear(n);
    for (const k of ['clientes','consertos','estoque','equip']){ S[k] = d[k] || []; for (const o of S[k]) await dbPut(k, o); }

}

/* ---------- Sincronização na nuvem (Supabase) ---------- */
/* Tudo é salvo primeiro no celular (IndexedDB). Quando há internet, o app junta as
   mudanças deste aparelho com as da nuvem (vale a edição mais recente de cada item). */
const SY = {st:'off', last:0, busy:false, again:false, timer:null, msg:'', err:''};
const SYS = ['clientes','consertos','estoque','equip','arquivos'];
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } },
  set(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const syCfg = () => LS.get('sb_cfg');
function syF(url, opt){ const f = window.CapacitorWebFetch ? window.CapacitorWebFetch.bind(window) : window.fetch.bind(window); return f(url, opt); }
const syMsgOf = (j, status) => {
  const t = String((j && (j.error_description || j.msg || j.message || j.error)) || '');
  if (/invalid login/i.test(t)) return 'E-mail ou senha incorretos. Confira se o usuário foi criado no Supabase.';
  if (/email not confirmed/i.test(t)) return 'Esse e-mail ainda não foi confirmado. No Supabase, crie o usuário marcando "Auto Confirm User".';
  if (/invalid api key|apikey/i.test(t)) return 'A chave pública está errada. Copie de novo a "Publishable key".';
  if (/signups not allowed|signup/i.test(t)) return 'Esse usuário não existe. Crie o usuário no Supabase (Authentication > Users).';
  return (t || ('erro ' + status)).slice(0, 160);
};

async function syToken(){
  const c = syCfg(), s = LS.get('sb_sess'); if (!c || !s) throw new Error('auth');
  if (s.access && s.exp > Date.now() + 60000) return s.access;
  let r;
  try { r = await syF(c.url + '/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{apikey:c.key, 'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:s.refresh})}); }
  catch(e){ const x = new Error('rede'); x.detail = 'sem acesso ao servidor (' + String(e && e.message || e) + ')'; throw x; }
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok || !j.access_token){ if ([400, 401, 403].includes(r.status)) throw new Error('auth'); const x = new Error('http'); x.detail = syMsgOf(j, r.status); throw x; }
  LS.set('sb_sess', {access:j.access_token, refresh:j.refresh_token || s.refresh, exp:Date.now() + (j.expires_in || 3600) * 1000});
  return j.access_token;
}
async function syReq(path, opt = {}){
  const c = syCfg(); if (!c) throw new Error('auth');
  const tk = await syToken();
  let r;
  try { r = await syF(c.url + path, {...opt, headers:{apikey:c.key, Authorization:'Bearer ' + tk, ...(opt.headers || {})}}); }
  catch(e){ const x = new Error('rede'); x.detail = 'sem acesso ao servidor (' + String(e && e.message || e) + ')'; throw x; }
  if (!r.ok){
    let j = null; try { j = JSON.parse(await r.text()); } catch(e){}
    const x = new Error(r.status === 401 ? 'auth' : 'http'); x.status = r.status; x.detail = syMsgOf(j, r.status); throw x;
  }
  return r;
}

/* entrar (e-mail e senha da oficina) */
async function syConnect(){
  const g = id => ($(id) && $(id).value || '').trim();
  let url = g('#syUrl').replace(/\/+$/, '').replace(/\/(rest|auth)\/v1.*$/, ''); const key = g('#syKey'), email = g('#syEmail'), pass = ($('#syPass') && $('#syPass').value) || '';
  if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  if (!url || !key || !email || !pass){ toast('Preencha os quatro campos.'); return; }
  SY.msg = ''; SY.st = 'busy'; syPaint();
  let r;
  try { r = await syF(url + '/auth/v1/token?grant_type=password', {method:'POST', headers:{apikey:key, 'Content-Type':'application/json'}, body:JSON.stringify({email, password:pass})}); }
  catch(e){ SY.msg = 'Sem acesso ao servidor (' + String(e && e.message || e) + '). Confira o endereço do projeto e a internet.'; SY.st = 'off'; syPaint(); toast('Não consegui entrar. Veja o motivo na tela.'); return; }
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok || !j.access_token){ SY.msg = syMsgOf(j, r.status); SY.st = 'off'; syPaint(); toast('Não consegui entrar. Veja o motivo na tela.'); return; }
  LS.set('sb_cfg', {url, key, email}); LS.set('sb_sess', {access:j.access_token, refresh:j.refresh_token, exp:Date.now() + (j.expires_in || 3600) * 1000}); LS.set('sb_pull', null);
  SY.st = 'idle'; SY.msg = ''; toast('Conectado!'); syPaint(); syRun();
}

/* junta o que está no celular com o que está na nuvem */
async function syncNow(){
  const full = !LS.get('sb_pull');
  const since = LS.get('sb_pull') || '1970-01-01T00:00:00Z';
  /* 1) buscar novidades da nuvem */
  const rows = []; let from = 0;
  for (;;){
    const r = await syReq(`/rest/v1/registros?select=store,id,atualizado,apagado,dados,modificado&modificado=gte.${encodeURIComponent(since)}&order=modificado.asc,store.asc,id.asc&limit=1000&offset=${from}`);
    const part = await r.json(); rows.push(...part); if (part.length < 1000) break; from += 1000;
  }
  const tombs = {}; for (const t of await dbAll(TOMB)) tombs[t.id] = t._u || 0;
  let changed = 0;
  for (const row of rows){
    if (!SYS.includes(row.store)) continue;
    const key = row.store + ':' + row.id, ru = Number(row.atualizado) || 0;
    const loc = await tx(row.store, 'readonly', s => s.get(row.id));
    const lu = loc ? (loc._u || 0) : -1, tu = key in tombs ? tombs[key] : -1;
    if (ru <= Math.max(lu, tu)) continue;
    if (tu >= 0){ await tx(TOMB, 'readwrite', s => s.delete(key)); delete tombs[key]; }
    if (row.apagado){ if (loc){ await tx(row.store, 'readwrite', s => s.delete(row.id)); changed++; } continue; }
    const rec = {...row.dados, id:row.id, _u:ru, _s:ru};
    if (row.store === 'arquivos'){
      try { const b = await (await syReq(`/storage/v1/object/authenticated/arquivos/${encodeURIComponent(row.id)}`)).blob(); rec.blob = new Blob([b], {type:rec.tipo || b.type}); }
      catch(e){ if (e.status === 404 || e.status === 400) continue; throw e; }
    }
    await tx(row.store, 'readwrite', s => s.put(rec)); changed++;
  }
  if (rows.length) LS.set('sb_pull', rows[rows.length - 1].modificado);
  /* 2) enviar o que é novo neste aparelho */
  const out = [], marks = [], gone = [];
  for (const s of SYS){
    for (const o of await dbAll(s)){
      const u = o._u || 0;
      if (!full && u === (o._s === undefined ? -1 : o._s)) continue;
      if (s === 'arquivos'){
        if (!o.blob) continue;
        await syReq(`/storage/v1/object/arquivos/${encodeURIComponent(o.id)}`, {method:'POST', headers:{'x-upsert':'true', 'Content-Type':o.tipo || 'application/octet-stream'}, body:o.blob});
      }
      const {blob, _s, ...meta} = o;
      out.push({store:s, id:o.id, atualizado:u, apagado:false, dados:meta}); marks.push([s, o.id, u]);
    }
  }
  for (const t of await dbAll(TOMB)){
    const i = t.id.indexOf(':'), s = t.id.slice(0, i), id = t.id.slice(i + 1);
    if (!SYS.includes(s)){ gone.push(t.id); continue; }
    if (s === 'arquivos'){ try { await syReq(`/storage/v1/object/arquivos/${encodeURIComponent(id)}`, {method:'DELETE'}); } catch(e){ if (e.status !== 404 && e.status !== 400) throw e; } }
    out.push({store:s, id, atualizado:t._u || 0, apagado:true, dados:null}); gone.push(t.id);
  }
  for (let i = 0; i < out.length; i += 100){
    await syReq('/rest/v1/registros?on_conflict=store,id', {method:'POST', headers:{'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(out.slice(i, i + 100))});
  }
  for (const [s, id, u] of marks) await tx(s, 'readwrite', st => { const g = st.get(id); g.onsuccess = () => { const o = g.result; if (o && (o._u || 0) === u){ o._s = u; st.put(o); } }; return g; });
  for (const id of gone) await tx(TOMB, 'readwrite', st => st.delete(id));
  /* 3) atualizar a tela */
  if (changed){
    const [c, k, s, q] = await Promise.all(['clientes','consertos','estoque','equip'].map(dbAll));
    S.clientes = c || []; S.consertos = k || []; S.estoque = s || []; S.equip = (q || []).map(e => ({semelhantes:[], pecas:[], comentarios:'', ...e}));
    Object.keys(filesCache).forEach(k => delete filesCache[k]);
    const kind = {cliente:'clientes', conserto:'consertos', item:'estoque', equip:'equip'}[route.v];
    if (kind && !S[kind].some(x => x.id === route.id)){ stack = []; route = {v:{cliente:'clientes', conserto:'consertos', item:'estoque', equip:'equips'}[route.v]}; }
    const ae = document.activeElement && document.activeElement.tagName;
    if (!$('#layer').innerHTML && $('#viewer').classList.contains('hidden') && ae !== 'TEXTAREA' && ae !== 'INPUT') render();
  }
}
async function syRun(){
  if (!syCfg() || memOnly || SY.st === 'authfail') return;
  if (!navigator.onLine){ SY.st = 'offline'; syPaint(); return; }
  if (SY.busy){ SY.again = true; return; }
  SY.busy = true; SY.st = 'busy'; SY.err = ''; syPaint();
  try { await syncNow(); SY.st = 'ok'; SY.last = Date.now(); LS.set('sb_last', SY.last); }
  catch(e){
    SY.st = e && e.message === 'auth' ? 'authfail' : (navigator.onLine ? 'err' : 'offline');
    SY.err = (e && (e.detail || e.message)) || '';
  }
  SY.busy = false; syPaint();
  if (SY.again){ SY.again = false; syQueue(1500); }
}
function syQueue(ms = 4000){ if (!syCfg()) return; clearTimeout(SY.timer); SY.timer = setTimeout(syRun, ms); }

/* tela */
function syStatusText(){
  const h = SY.last ? new Date(SY.last).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) : '';
  return ({
    busy:'Sincronizando…',
    idle: h ? 'Última sincronização às ' + h + '.' : 'Conectado. Aguardando a primeira sincronização.',
    ok:'Tudo sincronizado' + (h ? ' às ' + h : '') + '.',
    offline:'Sem internet. Tudo está sendo salvo no celular e será enviado quando a rede voltar.',
    err:'Não consegui sincronizar agora. O app tenta de novo sozinho.' + (SY.err ? ' Motivo: ' + SY.err : ''),
    authfail:'A conexão expirou ou a senha mudou. Toque em Sair da nuvem e entre de novo.'
  })[SY.st] || '';
}
function syBoxHTML(){
  if (!syCfg()) return `${SY.msg ? '<div class="warnbox">' + esc(SY.msg) + '</div>' : ''}<h2>Sincronizar na nuvem</h2><p class="sub">Salva tudo no celular na hora e envia para a nuvem quando há internet, passando as mudanças para os outros aparelhos. Use o mesmo e-mail e a mesma senha em todos. Para pegar os dados abaixo, siga o GUIA-NUVEM.txt.</p>
    <label class="fld"><span>Endereço do projeto (Project URL)</span><input id="syUrl" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://xxxx.supabase.co"></label>
    <label class="fld"><span>Chave pública (Publishable key)</span><input id="syKey" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="fld"><span>E-mail da oficina</span><input id="syEmail" type="email" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label class="fld"><span>Senha</span><input id="syPass" type="password" autocomplete="off"></label>
    <div class="actions"><button class="btn" data-act="sync-connect">Entrar na nuvem</button></div>`;
  return `<h2>Nuvem</h2><p class="sub" id="syst">${esc(syStatusText())}</p>
    <p class="sub">Tudo que você cadastra é salvo no celular na hora e enviado para a nuvem quando há internet. Os outros aparelhos com o mesmo e-mail e senha recebem as mudanças.</p>
    <div class="actions"><button class="btn" data-act="sync-now">Sincronizar agora</button><button class="btn danger" data-act="sync-off">Sair da nuvem</button></div>`;
}
function syPaint(){
  const b = $('#syncbox'); if (!b) return;
  if (document.activeElement && b.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
  const ids = ['#syUrl', '#syKey', '#syEmail', '#syPass'], keep = ids.map(i => $(i) ? $(i).value : '');
  b.innerHTML = syBoxHTML();
  if (!syCfg()) ids.forEach((i, n) => { if ($(i)) $(i).value = keep[n]; });
}
Object.assign(act, {
  'sync-connect': syConnect,
  'sync-now': () => { if (!navigator.onLine){ toast('Sem internet agora.'); return; } if (SY.st === 'authfail') SY.st = 'idle'; clearTimeout(SY.timer); syRun(); },
  'sync-off': () => confirmDlg('Sair da nuvem? Os dados continuam no celular e na nuvem.', () => { LS.set('sb_cfg', null); LS.set('sb_sess', null); LS.set('sb_pull', null); SY.st = 'off'; SY.msg = ''; syPaint(); }, 'Sair')
});
function syStart(){
  SY.last = Number(LS.get('sb_last') || 0);
  SY.st = syCfg() ? 'idle' : 'off';
  addEventListener('online', () => syRun());
  addEventListener('offline', () => { if (syCfg()){ SY.st = 'offline'; syPaint(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syRun(); });
  setInterval(() => { if (!document.hidden) syRun(); }, 60000);
  syRun();
}

/* ---------- início ---------- */
(async function init(){
  try { idb = await openDB(); } catch(e){ idb = null; memOnly = true; }
  try {
    const [c, k, s, q] = await Promise.all(['clientes','consertos','estoque','equip'].map(dbAll));
    S.clientes = c || []; S.consertos = k || []; S.estoque = s || []; S.equip = (q || []).map(e => ({semelhantes:[], pecas:[], comentarios:'', ...e}));
  } catch(e){ toast('Não consegui ler os dados salvos.'); }
  const A = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (A && A.addListener) A.addListener('backButton', () => {
    if (!$('#viewer').classList.contains('hidden')) closeViewer();
    else if ($('#layer').innerHTML) closeLayer();
    else if (stack.length) back();
    else A.exitApp();
  });
  S.consertos.forEach(x => { if (x.status === 'entregue'){ x.status = 'retirado'; dbPut('consertos', x); } });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  syStart();
  if (memOnly) toast('Dados não serão salvos neste navegador.');
})();
</script>
